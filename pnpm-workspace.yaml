packages:
  - 'frontend'
  - 'backend'

overrides:
  # firebase-functions pulls in @types/express@4 transitively, which conflicts
  # with our own @types/express@^5 (backend uses Express 5) and causes
  # environment-dependent type errors depending on how pnpm hoists the two
  # versions. Force one version everywhere.
  '@grpc/grpc-js@<1.13.6': ^1.13.6
  '@types/express': '^5.0.1'
  '@vitest/mocker@>=2.1.0 <4.1.11': ^4.1.11
  '@vitest/mocker@>=2.1.0-beta.7 <4.1.12': ^4.1.12
  # next@16.2.12 still bundles its own old postcss internally (separate from
  # the patched one Tailwind/Vite already use) — force it to a patched
  # version too. postcss 8.x is backward-compatible within the major.
  postcss: '^8.5.18'
  qs@>=2.2.5 <6.16.0: ^6.16.0
  qs@>=6.7.0 <=6.16.0: ^6.16.1
  # next also bundles an old sharp (image optimization) — force the patched line.
  sharp: '^0.35.0'
  tinypool@<2.1.2: ^2.1.2
  tinypool@<=2.1.0: ^2.1.1
  uuid@<11.1.1: ^11.1.1
  vitest@>=2.1.0 <4.1.11: ^4.1.11
  zod@<4.6.6: ^4.6.6
  # js-yaml (CVE-2026-59870) and nanoid highs from `pnpm audit` are disabled
  # here — see README.md § Security for the manual fix.
  # js-yaml: '^4.3.1'
  # nanoid: '^3.3.17'

allowBuilds:
  '@firebase/util': true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - uuid@11.1.1
  - nanoid@3.3.18
  - qs@6.15.4 || 6.16.0 || 6.16.1
  - next@16.3.3 || 16.3.6 || 16.3.8 || 16.4.1
  - vitest@4.1.11
  - '@vitest/mocker@4.1.11 || 4.1.12'
  - sharp@0.35.4 || 0.35.5
  - js-yaml@4.3.2
  - ip-address@10.5.1 || 10.7.1 || 10.7.4
  - brace-expansion@1.1.19 || 1.1.20 || 1.1.21 || 2.1.5 || 2.1.6 || 2.1.7 || 5.0.10 || 5.0.11 || 5.0.12
  - '@grpc/grpc-js@1.13.6 || 1.14.5'
  - '@fastify/busboy@3.2.1 || 3.2.2'
  - source-map-js@1.2.2
  - proxy-addr@2.0.8
  - tinypool@2.1.1 || 2.1.2
  - vite@7.3.7
  - zod@4.6.6
  - body-parser@1.20.9 || 2.4.0
